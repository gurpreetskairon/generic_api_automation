# Pytest configuration
[pytest]
markers =
    sanity: test is part of the sanity suite
    regression: test is part of the regression suite
    jenkins_client_creation: tests that trigger Jenkins to create fresh CMS clients
    dynamic_test_data: tests that rely on dynamically created test data
    business_outcome_comparison: comparison tests where IIB and Azure use separate dynamic clients and only business outcome is compared
python_files = *.py
testpaths = tests
render_collapsed = True
addopts = -ra --disable-pytest-warnings --capture=no --color=no
          --alluredir=allure-results
          --browser chromium
          --json-report --json-report-file=report.json
log_cli = True
log_cli_level = INFO
log_cli_format = %(levelname)s %(asctime)s (%(filename)-3s:%(lineno)-1s) - %(message)s
log_cli_date_format = %Y-%m-%d %I:%M:%S %p
log_file_level = INFO
log_file_format = %(levelname)s %(asctime)s (%(filename)s:%(lineno)s) - %(message)s
log_file_date_format = %Y-%m-%d %I:%M:%S %p
bdd_features_base_dir = .
