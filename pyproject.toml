[project]
name = "automation-test-project"
version = "0.1.0"
description = "Automation testing framework using Playwright"
requires-python = ">=3.10"

[tool.ruff]
target-version = "py310"
line-length = 120
exclude = [
    "*/__init__.py",
    "assets",
    "allure-results",
    "allure-report",
    ".md",
    "utils/api_utils/mock_server"
]

[tool.ruff.lint]
select = ["A", "C90", "E", "F", "I", "N", "W"]

ignore = ["COM812", "D100", "D101", "D102", "D103", "D104", "D105", "D107", "C901", "N806", "A002", "N801", "W291", "E501"]

[tool.ruff.lint.per-file-ignores]
# Ignore specific rules in certain files
"tests/conftest.py" = ["S101", "D100"]
"__init__.py" = ["D104", "F401", "N812", "F403", "F405"]

[tool.ruff.format]
quote-style = "double"
line-ending = "auto"
skip-magic-trailing-comma = true


[tool.ruff.lint.isort]
split-on-trailing-comma = false


[tool.mypy]
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
warn_unused_ignores = false
#warn_redundant_casts = true
#warn_return_any = true
#warn_unused_configs = true
disable_error_code = ["import-untyped", "no-any-return"]
exclude = [
    "assets/",
    "config/",
    "data/",
    "references/",
    "scripts/"
]
